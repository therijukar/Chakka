services:
  mysql:
    image: mysql:8.0
    container_name: fleet_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-fleet_root_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fleet_db}
      MYSQL_USER: ${MYSQL_USER:-fleet_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fleet_pass}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-fleet_root_pass}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fleet_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fleet_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: mysql://${MYSQL_USER:-fleet_user}:${MYSQL_PASSWORD:-fleet_pass}@mysql:3306/${MYSQL_DATABASE:-fleet_db}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-super-secret-change-in-prod}
      OCR_MODE: ${OCR_MODE:-mock}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - ./backend/uploads:/app/uploads

volumes:
  mysql_data:
  redis_data:
